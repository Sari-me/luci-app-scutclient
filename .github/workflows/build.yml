name: Build OpenWrt IPK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'Makefile'
      - 'luasrc/**'
      - 'root/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}-22.03.7
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - aarch64_cortex-a53
          - arm_cortex-a7_neon-vfpv4
          - mipsel_24kc
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare temporary OpenWrt feed
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .ci-feed
          mkdir -p .ci-feed/luci-app-scutclient
          mkdir -p .ci-feed/scutclient

          # 当前仓库本身就是 luci-app-scutclient 包。
          # gh-action-sdk 需要 feed 根目录下面存在独立的软件包目录，
          # 因此在 CI 中复制到临时 feed，而不要求重新修改仓库目录树。
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.ci-feed/' \
            ./ .ci-feed/luci-app-scutclient/

          # scutclient 核心包不在本仓库中。
          # 固定使用上游 OpenWrt package recipe；其当前稳定版本为 3.1.3。
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/scutclient/scutclient/master/openwrt/Makefile \
            -o .ci-feed/scutclient/Makefile

          echo '=== CI feed ==='
          find .ci-feed -maxdepth 3 -type f | sort

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-22.03.7
          FEED_DIR: ${{ github.workspace }}/.ci-feed
          FEEDNAME: scutclient_ci
          PACKAGES: scutclient luci-app-scutclient
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          MAKEFLAGS: -j$(nproc)
          V: s

      - name: Show generated packages
        shell: bash
        run: |
          set -e
          echo '=== Generated IPK files ==='
          find bin -type f -name '*.ipk' -print || true

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scutclient-${{ matrix.arch }}-22.03.7
          path: |
            bin/packages/${{ matrix.arch }}/scutclient_ci/*.ipk
          if-no-files-found: error