name: Build OpenWrt IPK

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - "Makefile"
      - "luasrc/**"
      - "root/**"
      - "po/**"
      - "htdocs/**"
      - "luci-app-scutclient/**"
      - ".github/workflows/build.yml"

  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: ${{ matrix.arch }} / OpenWrt 22.03.7

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - arm_cortex-a7_neon-vfpv4
          - mipsel_24kc


    steps:

      - name: Checkout LuCI repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Prepare combined OpenWrt feed
        shell: bash

        run: |
          set -euxo pipefail

          rm -rf .ci-feed
          rm -rf .scutclient-core

          mkdir -p .ci-feed/luci-app-scutclient


          echo "======================================"
          echo "Repository tree"
          echo "======================================"

          find . \
            -maxdepth 4 \
            -type f \
            ! -path "./.git/*" \
            | sort


          #
          # ----------------------------------------
          # Prepare luci-app-scutclient
          # ----------------------------------------
          #
          # Makefile currently lives at repository
          # root.
          #

          test -f Makefile

          cp \
            Makefile \
            .ci-feed/luci-app-scutclient/Makefile


          #
          # Support normal flat LuCI layout:
          #
          #   Makefile
          #   luasrc/
          #   root/
          #   po/
          #
          # and the temporary nested layout:
          #
          #   Makefile
          #   luci-app-scutclient/
          #       luasrc/
          #       root/
          #       po/
          #


          copy_package_dir()
          {
            SRC="$1"
            DST="$2"

            if [ -d "$SRC" ]; then

              echo "Copying:"
              echo "  $SRC"
              echo "->"
              echo "  $DST"

              mkdir -p "$DST"

              rsync -a \
                "$SRC/" \
                "$DST/"
            fi
          }


          #
          # Flat repository layout
          #

          copy_package_dir \
            "luasrc" \
            ".ci-feed/luci-app-scutclient/luasrc"

          copy_package_dir \
            "root" \
            ".ci-feed/luci-app-scutclient/root"

          copy_package_dir \
            "po" \
            ".ci-feed/luci-app-scutclient/po"

          copy_package_dir \
            "htdocs" \
            ".ci-feed/luci-app-scutclient/htdocs"


          #
          # Nested repository layout
          #

          copy_package_dir \
            "luci-app-scutclient/luasrc" \
            ".ci-feed/luci-app-scutclient/luasrc"

          copy_package_dir \
            "luci-app-scutclient/root" \
            ".ci-feed/luci-app-scutclient/root"

          copy_package_dir \
            "luci-app-scutclient/po" \
            ".ci-feed/luci-app-scutclient/po"

          copy_package_dir \
            "luci-app-scutclient/htdocs" \
            ".ci-feed/luci-app-scutclient/htdocs"


          echo "======================================"
          echo "Validate luci-app-scutclient"
          echo "======================================"

          test -f \
            .ci-feed/luci-app-scutclient/Makefile

          test -d \
            .ci-feed/luci-app-scutclient/luasrc


          test -f \
            .ci-feed/luci-app-scutclient/luasrc/controller/scutclient.lua

          test -f \
            .ci-feed/luci-app-scutclient/luasrc/model/cbi/scutclient/scutclient.lua


          grep -q \
            '^PKG_NAME:=luci-app-scutclient$' \
            .ci-feed/luci-app-scutclient/Makefile


          grep -q \
            '^LUCI_DEPENDS:=.*+scutclient' \
            .ci-feed/luci-app-scutclient/Makefile


          echo "======================================"
          echo "LuCI package tree"
          echo "======================================"

          find \
            .ci-feed/luci-app-scutclient \
            -maxdepth 6 \
            -type f \
            | sort



          #
          # ----------------------------------------
          # Fetch Sari-me/scutclient
          # ----------------------------------------
          #

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/Sari-me/scutclient.git \
            .scutclient-core


          echo "======================================"
          echo "scutclient source revision"
          echo "======================================"

          git \
            -C .scutclient-core \
            log \
            -1 \
            --oneline

          git \
            -C .scutclient-core \
            rev-parse \
            HEAD



          #
          # ----------------------------------------
          # Construct scutclient OpenWrt package
          # ----------------------------------------
          #
          # Reproduce the same layout used by
          # Sari-me/scutclient's own OpenWrt Action.
          #

          mkdir -p \
            .ci-feed/scutclient/files


          cp \
            .scutclient-core/openwrt/Makefile \
            .ci-feed/scutclient/Makefile


          cp \
            .scutclient-core/CMakeLists.txt \
            .ci-feed/scutclient/CMakeLists.txt


          cp \
            .scutclient-core/COPYING \
            .ci-feed/scutclient/COPYING


          cp -a \
            .scutclient-core/src \
            .ci-feed/scutclient/src


          cp \
            .scutclient-core/openwrt/files/scutclient.config \
            .ci-feed/scutclient/files/scutclient.config


          cp \
            .scutclient-core/openwrt/files/scutclient.init \
            .ci-feed/scutclient/files/scutclient.init


          cp \
            .scutclient-core/openwrt/files/scutclient.hotplug \
            .ci-feed/scutclient/files/scutclient.hotplug



          echo "======================================"
          echo "Validate scutclient"
          echo "======================================"

          test -f \
            .ci-feed/scutclient/Makefile

          test -f \
            .ci-feed/scutclient/CMakeLists.txt

          test -f \
            .ci-feed/scutclient/COPYING

          test -d \
            .ci-feed/scutclient/src

          test -f \
            .ci-feed/scutclient/files/scutclient.config

          test -f \
            .ci-feed/scutclient/files/scutclient.init

          test -f \
            .ci-feed/scutclient/files/scutclient.hotplug


          grep -q \
            '^PKG_NAME:=scutclient$' \
            .ci-feed/scutclient/Makefile



          echo "======================================"
          echo "Complete OpenWrt feed"
          echo "======================================"

          find \
            .ci-feed \
            -maxdepth 6 \
            -type f \
            | sort



      - name: Build scutclient and LuCI package
        uses: openwrt/gh-action-sdk@main

        env:

          ARCH: ${{ matrix.arch }}-22.03.7

          FEED_DIR: ${{ github.workspace }}/.ci-feed

          FEEDNAME: scutclient_ci

          PACKAGES: >-
            scutclient
            luci-app-scutclient

          BUILD_LOG: 1

          NO_REFRESH_CHECK: 1

          NO_SHFMT_CHECK: 1

          V: s



      - name: Show build logs on failure
        if: failure()

        shell: bash

        run: |

          echo "======================================"
          echo "Available logs"
          echo "======================================"

          find logs \
            -type f \
            -print \
            2>/dev/null || true


          echo "======================================"
          echo "dump.txt"
          echo "======================================"

          while IFS= read -r log
          do

            echo
            echo "--------------------------------------"
            echo "$log"
            echo "--------------------------------------"

            cat "$log" || true

          done < <(
            find logs \
              -type f \
              -name "dump.txt" \
              -print \
              2>/dev/null || true
          )


          echo "======================================"
          echo "compile.txt"
          echo "======================================"

          while IFS= read -r log
          do

            echo
            echo "--------------------------------------"
            echo "$log"
            echo "--------------------------------------"

            tail \
              -n 500 \
              "$log" || true

          done < <(
            find logs \
              -type f \
              -name "compile.txt" \
              -print \
              2>/dev/null || true
          )



      - name: Show generated packages
        if: always()

        shell: bash

        run: |

          echo "======================================"
          echo "Generated packages"
          echo "======================================"

          find bin \
            -type f \
            \( \
              -name "*.ipk" \
              -o \
              -name "*.apk" \
            \) \
            -print \
            2>/dev/null || true



      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v7

        with:

          name: scutclient-${{ matrix.arch }}-22.03.7

          path: |
            bin/packages/**/scutclient_ci/scutclient_*.ipk
            bin/packages/**/scutclient_ci/luci-app-scutclient_*.ipk

          if-no-files-found: error