name: Build OpenWrt IPK

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - "Makefile"
      - "luasrc/**"
      - "root/**"
      - ".github/workflows/build.yml"

  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }} / OpenWrt 22.03.7
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - arm_cortex-a7_neon-vfpv4
          - mipsel_24kc

    steps:
      - name: Checkout LuCI repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare combined OpenWrt feed
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .ci-feed
          rm -rf .scutclient-core

          #
          # 1. Prepare luci-app-scutclient package.
          #
          # This repository itself is the LuCI package, so copy the repository
          # root into one package directory below the temporary feed.
          #
          mkdir -p .ci-feed/luci-app-scutclient

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".ci-feed/" \
            --exclude=".scutclient-core/" \
            ./ .ci-feed/luci-app-scutclient/

          #
          # 2. Fetch Sari-me/scutclient.
          #
          # Do not use the original scutclient/scutclient OpenWrt recipe.
          # The fork contains the bundled-source OpenWrt package definition
          # used by its own GitHub Actions build.
          #
          git clone \
            --depth 1 \
            --branch master \
            https://github.com/Sari-me/scutclient.git \
            .scutclient-core

          echo "===== scutclient source revision ====="
          git -C .scutclient-core log -1 --oneline
          git -C .scutclient-core rev-parse HEAD

          #
          # 3. Reproduce Sari-me/scutclient's own OpenWrt feed layout.
          #
          # Expected package layout:
          #
          # .ci-feed/scutclient/
          #   Makefile
          #   CMakeLists.txt
          #   COPYING
          #   src/
          #   files/
          #
          mkdir -p .ci-feed/scutclient/files

          cp \
            .scutclient-core/openwrt/Makefile \
            .ci-feed/scutclient/Makefile

          cp \
            .scutclient-core/CMakeLists.txt \
            .ci-feed/scutclient/CMakeLists.txt

          cp \
            .scutclient-core/COPYING \
            .ci-feed/scutclient/COPYING

          cp -a \
            .scutclient-core/src \
            .ci-feed/scutclient/src

          cp \
            .scutclient-core/openwrt/files/scutclient.config \
            .ci-feed/scutclient/files/scutclient.config

          cp \
            .scutclient-core/openwrt/files/scutclient.init \
            .ci-feed/scutclient/files/scutclient.init

          cp \
            .scutclient-core/openwrt/files/scutclient.hotplug \
            .ci-feed/scutclient/files/scutclient.hotplug

          #
          # 4. Validate both packages before starting the SDK.
          #
          echo "===== validate luci-app-scutclient ====="

          test -f .ci-feed/luci-app-scutclient/Makefile
          test -d .ci-feed/luci-app-scutclient/luasrc
          test -d .ci-feed/luci-app-scutclient/root

          grep -q \
            '^PKG_NAME:=luci-app-scutclient$' \
            .ci-feed/luci-app-scutclient/Makefile

          grep -q \
            '^LUCI_DEPENDS:=.*+scutclient' \
            .ci-feed/luci-app-scutclient/Makefile

          echo "===== validate scutclient ====="

          test -f .ci-feed/scutclient/Makefile
          test -f .ci-feed/scutclient/CMakeLists.txt
          test -f .ci-feed/scutclient/COPYING
          test -d .ci-feed/scutclient/src
          test -f .ci-feed/scutclient/files/scutclient.config
          test -f .ci-feed/scutclient/files/scutclient.init
          test -f .ci-feed/scutclient/files/scutclient.hotplug

          grep -q \
            '^PKG_NAME:=scutclient$' \
            .ci-feed/scutclient/Makefile

          echo "===== combined feed tree ====="
          find .ci-feed -maxdepth 4 -type f -print | sort

      - name: Build scutclient and LuCI package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-22.03.7
          FEED_DIR: ${{ github.workspace }}/.ci-feed
          FEEDNAME: scutclient_ci
          PACKAGES: scutclient luci-app-scutclient
          BUILD_LOG: 1
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          V: s

      - name: Show build logs on failure
        if: failure()
        shell: bash
        run: |
          echo "===== available logs ====="
          find logs -type f -print 2>/dev/null || true

          echo "===== dump logs ====="
          while IFS= read -r log; do
            echo "----- $log -----"
            cat "$log" || true
          done < <(
            find logs -type f -name "dump.txt" -print 2>/dev/null || true
          )

          echo "===== compile logs ====="
          while IFS= read -r log; do
            echo "----- $log -----"
            tail -n 400 "$log" || true
          done < <(
            find logs -type f -name "compile.txt" -print 2>/dev/null || true
          )

      - name: Show generated packages
        if: always()
        shell: bash
        run: |
          echo "===== generated packages ====="
          find bin -type f \
            \( -name "*.ipk" -o -name "*.apk" \) \
            -print 2>/dev/null || true

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scutclient-${{ matrix.arch }}-22.03.7
          path: |
            bin/packages/**/scutclient_ci/scutclient_*.ipk
            bin/packages/**/scutclient_ci/luci-app-scutclient_*.ipk
          if-no-files-found: error