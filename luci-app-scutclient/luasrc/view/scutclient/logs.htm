<%+header%>

<style type="text/css">
.scut-log-actions {
	display: flex;
	flex-wrap: wrap;
	gap: .5rem;
	margin: .75rem 0;
}

#scut-log {
	width: 100%;
	min-height: 420px;
	box-sizing: border-box;
	font-family: monospace;
	font-size: 12px;
	line-height: 1.45;
	resize: vertical;
}
</style>

<h2><%:SCUT Client Logs%></h2>

<div class="cbi-map-descr">
	<%:The latest 200 lines are refreshed automatically. The download contains only the scutclient log and does not include UCI configuration or account passwords.%>
</div>

<div class="scut-log-actions">
	<button class="cbi-button cbi-button-action" type="button" onclick="loadLog(true)">
		<%:Refresh%>
	</button>

	<a class="cbi-button cbi-button-apply"
	   href="<%=luci.dispatcher.build_url('admin', 'services', 'scutclient', 'scutclient.log')%>">
		<%:Download log%>
	</a>
</div>

<textarea id="scut-log" readonly="readonly" wrap="off"><%:Loading…%></textarea>

<script type="text/javascript">
(function() {
	var logUrl = '<%=luci.dispatcher.build_url("admin", "services", "scutclient", "get_log")%>';
	var timer = null;

	window.loadLog = function(forceScroll) {
		var box = document.getElementById('scut-log');
		var xhr = new XMLHttpRequest();

		if (!box) {
			return;
		}

		var nearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 40;

		xhr.open('GET', logUrl, true);
		xhr.onreadystatechange = function() {
			if (xhr.readyState !== 4) {
				return;
			}

			if (xhr.status >= 200 && xhr.status < 300) {
				box.value = xhr.responseText || '';
				if (forceScroll || nearBottom) {
					box.scrollTop = box.scrollHeight;
				}
			} else {
				box.value = '<%:Unable to load log.%>';
			}
		};
		xhr.send(null);
	};

	window.loadLog(true);
	timer = window.setInterval(function() {
		window.loadLog(false);
	}, 3000);
})();
</script>

<%+footer%>
