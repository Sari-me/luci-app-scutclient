<!-- Per-instance portal Location probe (DummyValue template).
     The button resolves its own UCI section id from data-scut-section,
     falling back to the per-instance container id (cbi-scutclient-<sid>),
     and reads/writes this instance's fields by their full cbid - it can
     never touch another instance. Shown only when auth_method=portal. -->
<style type="text/css">
.scut-portal-probe-status {
	margin-left: .75rem;
}

.scut-portal-probe-status.scut-good {
	color: #2d8a34;
	font-weight: 600;
}

.scut-portal-probe-status.scut-warn {
	color: #c17d00;
	font-weight: 600;
}

.scut-portal-probe-status.scut-bad {
	color: #c9302c;
	font-weight: 600;
}
</style>

<div class="cbi-value" id="<%=self.option%>-<%=section or ''%>">
	<button type="button"
		class="cbi-button cbi-button-apply scut-portal-probe-btn"
		data-scut-section="<%=section or ''%>"
		disabled
		onclick="scutProbeLocation(this); return false;">
		<%:Send test request / Detect Location%>
	</button>
	<span class="scut-portal-probe-status"
		data-scut-section="<%=section or ''%>"></span>
</div>

<script type="text/javascript">
	// 共享配置：多个实例各渲染一份模板，这里保证只初始化一次
	window.scutProbeUrl = window.scutProbeUrl ||
		'<%=luci.dispatcher.build_url("admin", "services", "scutclient", "api_portal_probe")%>';
	window.scutProbeToken = window.scutProbeToken || '<%=token%>';
	window.scutProbeL = window.scutProbeL || {
		normal: '<%:Send test request / Detect Location%>',
		testing: '<%:Testing…%>',
		detected: '<%:Location detected%>',
		noRedirect: '<%:No redirect detected%>',
		noLocation: '<%:HTTP response without Location%>',
		notReady: '<%:Interface is not ready.%>',
		failed: '<%:Probe failed.%>',
		stale: '<%:Interface changed. Test Location again.%>',
		unknown: '<%:Probe button state could not be determined. Reload the page.%>'
	};
</script>

<script type="text/javascript">
if (typeof scutProbeInit === 'undefined') {
	window.scutProbeInit = true;

	window.scutProbeField = function(sid, option) {
		return sid
			? document.getElementById('cbid.scutclient.' + sid + '.' + option)
			: null;
	};

	// 主来源是模板写入的 data-scut-section；若主题/缓存导致其为空，
	// 则从所在实例容器 id（cbi-scutclient-<sid>）反解。
	window.scutProbeSection = function(btn) {
		var sid = btn.getAttribute('data-scut-section');

		if (sid) {
			return sid;
		}

		var node = btn.closest
			? btn.closest('.cbi-section-node')
			: null;

		if (node && node.id && node.id.indexOf('cbi-scutclient-') === 0) {
			return node.id.substring('cbi-scutclient-'.length);
		}

		return '';
	};

	window.scutProbeRefresh = function(btn) {
		var sid = scutProbeSection(btn);
		var method = scutProbeField(sid, 'auth_method');
		var iface = scutProbeField(sid, 'interface');

		// portal 模式且已选择 WAN 才可点击
		btn.disabled = !(
			method && method.value === 'portal' &&
			iface && iface.value !== ''
		);
	};

	window.scutProbeRefreshAll = function() {
		var buttons = document.querySelectorAll('button.scut-portal-probe-btn');

		Array.prototype.forEach.call(buttons, scutProbeRefresh);
	};

	window.scutProbeStatus = function(sid, html, cls) {
		var nodes = sid === ''
			? document.querySelectorAll('span.scut-portal-probe-status')
			: document.querySelectorAll(
				'span.scut-portal-probe-status[data-scut-section="' + sid + '"]'
			);

		Array.prototype.forEach.call(nodes, function(node) {
			node.innerHTML = html;
			node.className = 'scut-portal-probe-status ' + (cls || '');
		});
	};

	window.scutProbeLocation = function(btn) {
		var sid = scutProbeSection(btn);
		var iface = scutProbeField(sid, 'interface');
		var location = scutProbeField(sid, 'portal_location');

		if (!sid || !iface) {
			scutProbeStatus(sid, scutProbeL.unknown, 'scut-bad');
			return;
		}

		if (!iface.value) {
			scutProbeStatus(sid, scutProbeL.notReady, 'scut-bad');
			return;
		}

		btn.disabled = true;
		btn.textContent = scutProbeL.testing;

		var xhr = new XMLHttpRequest();
		xhr.open('POST', window.scutProbeUrl, true);
		xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
		xhr.onreadystatechange = function() {
			if (xhr.readyState !== 4) {
				return;
			}

			var data = null;
			try {
				data = JSON.parse(xhr.responseText);
			} catch (e) {
				data = null;
			}

			var esc = function(v) {
				var n = document.createElement('span');
				n.textContent = v === undefined || v === null ? '' : String(v);
				return n.innerHTML;
			};

			if (xhr.status >= 200 && xhr.status < 300 && data) {
				if (data.success && data.location) {
					// 只填当前实例，不自动保存
					if (location) {
						location.value = data.location;
						location.dispatchEvent(
							new Event('change', { bubbles: true })
						);
					}
					scutProbeStatus(
						sid,
						scutProbeL.detected + ': ' +
						esc(data.interface) + ' -> ' + esc(data.device) +
						' · HTTP ' + esc(data.http_code),
						'scut-good'
					);
				} else if (data.reason === 'no_redirect') {
					scutProbeStatus(
						sid,
						scutProbeL.noRedirect + ' (HTTP ' + esc(data.http_code) + ')',
						'scut-warn'
					);
				} else if (data.reason === 'no_location') {
					scutProbeStatus(
						sid,
						scutProbeL.noLocation + ' (HTTP ' + esc(data.http_code) + ')',
						'scut-warn'
					);
				} else if (data.reason === 'interface_not_ready') {
					scutProbeStatus(sid, scutProbeL.notReady, 'scut-bad');
				} else {
					scutProbeStatus(sid, scutProbeL.failed, 'scut-bad');
				}
			} else {
				scutProbeStatus(sid, scutProbeL.failed, 'scut-bad');
			}

			btn.textContent = scutProbeL.normal;
			scutProbeRefresh(btn);
		};
		xhr.send(
			'token=' + encodeURIComponent(window.scutProbeToken) +
			'&interface=' + encodeURIComponent(iface.value)
		);
	};

	// 事件委托：页面上任何表单值变化都重新计算全部按钮状态。
	// 不再逐元素绑定 change，天然覆盖 tab 切换、主题脚本与动态节点。
	if (!window.scutProbeDelegated) {
		window.scutProbeDelegated = true;

		document.addEventListener('change', function() {
			scutProbeRefreshAll();
		});
	}

	// 初始状态：解析后立即算一次，DOMContentLoaded 再兜底一次，
	// 并留一个延迟刷新应对主题在 DOM ready 之后才插入表单节点的情况。
	scutProbeRefreshAll();

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', scutProbeRefreshAll);
	}

	window.setTimeout(scutProbeRefreshAll, 800);
}
</script>
