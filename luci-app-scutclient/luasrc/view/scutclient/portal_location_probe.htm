<!-- Per-instance portal Location probe (DummyValue template).
     Field lookup is scoped to the current .cbi-section-node (the
     per-instance container rendered by TypedSection), so the button can
     never read or write another instance's fields and does not depend
     on any cbid scheme. Shown only when auth_method=portal (CBI
     depends); enabled purely by a non-empty interface selection. -->
<style type="text/css">
.scut-portal-probe-status {
	margin-left: .75rem;
}

.scut-portal-probe-status.scut-good {
	color: #2d8a34;
	font-weight: 600;
}

.scut-portal-probe-status.scut-warn {
	color: #c17d00;
	font-weight: 600;
}

.scut-portal-probe-status.scut-bad {
	color: #c9302c;
	font-weight: 600;
}
</style>

<div class="cbi-value" id="<%=self.option%>-<%=section or ''%>">
	<button type="button"
		class="cbi-button cbi-button-apply scut-portal-probe-btn"
		disabled
		onclick="scutProbeLocation(this); return false;">
		<%:Send test request / Detect Location%>
	</button>
	<span class="scut-portal-probe-status"></span>
</div>

<script type="text/javascript">
	// 共享配置：多个实例各渲染一份模板，这里保证只初始化一次
	window.scutProbeUrl = window.scutProbeUrl ||
		'<%=luci.dispatcher.build_url("admin", "services", "scutclient", "api_portal_probe")%>';
	window.scutProbeToken = window.scutProbeToken || '<%=token%>';
	window.scutProbeL = window.scutProbeL || {
		normal: '<%:Send test request / Detect Location%>',
		testing: '<%:Testing…%>',
		detected: '<%:Location detected%>',
		noRedirect: '<%:No redirect detected%>',
		noLocation: '<%:HTTP response without Location%>',
		notReady: '<%:Interface is not ready.%>',
		failed: '<%:Probe failed.%>',
		stale: '<%:Interface changed. Test Location again.%>'
	};
</script>

<script type="text/javascript">
if (typeof scutProbeInit === 'undefined') {
	window.scutProbeInit = true;

	// 当前实例上下文：按钮所在 .cbi-section-node 即本实例容器，
	// 只在该容器内查找本实例的 interface / Location 字段。
	window.scutProbeContext = function(btn) {
		if (!btn) {
			return null;
		}

		var node = btn.closest
			? btn.closest('.cbi-section-node')
			: null;

		if (!node) {
			return null;
		}

		return {
			node: node,
			iface: node.querySelector('select[id$=".interface"]'),
			location: node.querySelector('input[id$=".portal_location"]')
		};
	};

	// 是否可点击只由本实例 interface 是否已选择决定；
	// portal 模式的显示/隐藏由 CBI depends(auth_method=portal) 管理。
	window.scutProbeRefresh = function(btn) {
		var ctx = scutProbeContext(btn);

		btn.disabled = !(
			ctx && ctx.iface && ctx.iface.value !== ''
		);
	};

	window.scutProbeRefreshAll = function() {
		var buttons = document.querySelectorAll('button.scut-portal-probe-btn');

		Array.prototype.forEach.call(buttons, scutProbeRefresh);
	};

	window.scutProbeStatus = function(btn, text, cls) {
		var parent = btn.parentNode;

		if (!parent) {
			return;
		}

		var status = parent.querySelector('.scut-portal-probe-status');

		if (!status) {
			return;
		}

		status.innerHTML = text || '';
		status.className = 'scut-portal-probe-status ' + (cls || '');
	};

	window.scutProbeLocation = function(btn) {
		var ctx = scutProbeContext(btn);

		if (!ctx || !ctx.iface) {
			return false;
		}

		if (!ctx.iface.value) {
			return false;
		}

		btn.disabled = true;
		btn.textContent = window.scutProbeL.testing;

		var xhr = new XMLHttpRequest();
		xhr.open('POST', window.scutProbeUrl, true);
		xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
		xhr.onreadystatechange = function() {
			if (xhr.readyState !== 4) {
				return;
			}

			var data = null;
			try {
				data = JSON.parse(xhr.responseText);
			} catch (e) {
				data = null;
			}

			var esc = function(v) {
				var n = document.createElement('span');
				n.textContent = v === undefined || v === null ? '' : String(v);
				return n.innerHTML;
			};

			if (xhr.status >= 200 && xhr.status < 300 && data) {
				if (data.success && data.location) {
					// 只写当前实例的 Location，不自动保存
					if (ctx.location) {
						ctx.location.value = data.location;
						ctx.location.dispatchEvent(
							new Event('change', { bubbles: true })
						);
					}
					scutProbeStatus(
						btn,
						window.scutProbeL.detected + ': ' +
						esc(data.interface) + ' -> ' + esc(data.device) +
						' · HTTP ' + esc(data.http_code),
						'scut-good'
					);
				} else if (data.reason === 'no_redirect') {
					scutProbeStatus(
						btn,
						window.scutProbeL.noRedirect + ' (HTTP ' + esc(data.http_code) + ')',
						'scut-warn'
					);
				} else if (data.reason === 'no_location') {
					scutProbeStatus(
						btn,
						window.scutProbeL.noLocation + ' (HTTP ' + esc(data.http_code) + ')',
						'scut-warn'
					);
				} else if (data.reason === 'interface_not_ready') {
					scutProbeStatus(btn, window.scutProbeL.notReady, 'scut-bad');
				} else {
					scutProbeStatus(btn, window.scutProbeL.failed, 'scut-bad');
				}
			} else {
				scutProbeStatus(btn, window.scutProbeL.failed, 'scut-bad');
			}

			btn.textContent = window.scutProbeL.normal;
			scutProbeRefresh(btn);
		};
		xhr.send(
			'token=' + encodeURIComponent(window.scutProbeToken) +
			'&interface=' + encodeURIComponent(ctx.iface.value)
		);

		return false;
	};

	// 事件委托：interface / auth_method 变化时刷新全部按钮状态
	document.addEventListener('change', function(e) {
		if (e.target && e.target.id && e.target.id.indexOf('cbid.') === 0 &&
			(e.target.matches('select[id$=".interface"]') ||
			 e.target.matches('select[id$=".auth_method"]'))) {
			scutProbeRefreshAll();
		}
	});

	// 初始状态：解析后立即算一次，DOMContentLoaded 兜底，
	// 并用短延迟刷新应对 Argon 等主题延迟重建 DOM 的情况。
	scutProbeRefreshAll();

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', scutProbeRefreshAll);
	}

	window.setTimeout(scutProbeRefreshAll, 100);
	window.setTimeout(scutProbeRefreshAll, 500);
	window.setTimeout(scutProbeRefreshAll, 1000);
}
</script>
