<!-- Real-time WAN exclusivity lock (front-end UX only).
     Reads the live values of every interface select on this page and
     disables options already picked by another instance. The final
     safety net is the init script's exclusivity check on start. -->
<script type="text/javascript">
(function() {
	function getSelects() {
		return Array.prototype.slice.call(
			document.querySelectorAll(
				'select[id^="cbid.scutclient."][id$=".interface"]'
			)
		);
	}

	function refreshLocks() {
		var selects = getSelects();

		selects.forEach(function(select) {
			Array.prototype.forEach.call(select.options, function(option) {
				// 空占位项保持可选
				if (!option.value) {
					option.disabled = false;
					return;
				}

				// 自己已选中的值保持可用，避免出现"禁用的选中项"
				if (option.value === select.value) {
					option.disabled = false;
					return;
				}

				var usedByOther = selects.some(function(other) {
					return other !== select &&
					       other.value === option.value;
				});

				option.disabled = usedByOther;
			});
		});
	}

	function bind() {
		getSelects().forEach(function(select) {
			if (!select.dataset.scutLock) {
				select.dataset.scutLock = "1";
				select.addEventListener("change", refreshLocks);
			}
		});

		refreshLocks();
	}

	if (document.readyState === "loading") {
		document.addEventListener("DOMContentLoaded", bind);
	} else {
		bind();
	}
})();
</script>
