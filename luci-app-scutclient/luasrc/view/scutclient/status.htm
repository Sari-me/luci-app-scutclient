<%+header%>

<style type="text/css">
.scut-status-grid {
	display: flex;
	flex-wrap: wrap;
	gap: 1rem;
	margin-top: 1rem;
}

.scut-status-card {
	flex: 1 1 320px;
	min-width: 0;
	border: 1px solid rgba(127, 127, 127, .25);
	border-radius: .35rem;
	padding: 1rem;
	box-sizing: border-box;
}

.scut-status-card h3 {
	margin-top: 0;
	word-break: break-word;
}

.scut-row {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 1rem;
	padding: .55rem 0;
	border-bottom: 1px solid rgba(127, 127, 127, .18);
}

.scut-row:last-child {
	border-bottom: 0;
}

.scut-label {
	font-weight: 600;
	flex: 0 0 42%;
}

.scut-value {
	flex: 1 1 auto;
	min-width: 0;
	word-break: break-word;
	text-align: right;
}

.scut-good {
	color: #2d8a34;
	font-weight: 600;
}

.scut-warn {
	color: #c17d00;
	font-weight: 600;
}

.scut-bad {
	color: #c9302c;
	font-weight: 600;
}

.scut-muted {
	opacity: .72;
}

.scut-actions {
	display: flex;
	flex-wrap: wrap;
	gap: .5rem;
	margin-top: 1rem;
}

.scut-actions .cbi-button {
	text-decoration: none;
}

#scut-message {
	margin-top: .75rem;
}

@media (max-width: 700px) {
	.scut-status-grid {
		display: block;
	}

	.scut-status-card {
		margin-bottom: 1rem;
	}

	.scut-row {
		display: block;
	}

	.scut-value {
		text-align: left;
		margin-top: .25rem;
	}
}
</style>

<h2><%:SCUT Client Status%></h2>

<div class="cbi-map-descr">
	<%:Overview of every authentication instance. Account passwords are intentionally never displayed here.%>
</div>

<div class="scut-row">
	<div class="scut-label"><%:Service%></div>
	<div class="scut-value">
		<span id="scut-enabled">-</span>
		<span class="scut-muted" id="scut-version"></span>
	</div>
</div>

<div class="scut-row">
	<div class="scut-label"><%:Network status%></div>
	<div class="scut-value" id="scut-netstat"><%:Loading…%></div>
</div>

<div id="scut-instances" class="scut-status-grid">
	<div class="scut-muted"><%:Loading…%></div>
</div>

<div id="scut-message" class="scut-muted"></div>

<script type="text/javascript">
(function() {
	var statusUrl = '<%=luci.dispatcher.build_url("admin", "services", "scutclient", "api_status")%>';
	var netstatUrl = '<%=luci.dispatcher.build_url("admin", "services", "scutclient", "api_netstat")%>';
	var serviceUrl = '<%=luci.dispatcher.build_url("admin", "services", "scutclient", "api_service")%>';
	var logsUrl = '<%=luci.dispatcher.build_url("admin", "services", "scutclient", "logs")%>';
	var csrfToken = '<%=token%>';

	var L = {
		running: '<%:Running%>',
		stopped: '<%:Stopped%>',
		yes: '<%:Yes%>',
		no: '<%:No%>',
		start: '<%:Start%>',
		restart: '<%:Restart%>',
		stop: '<%:Stop%>',
		logoff: '<%:Log off%>',
		logs: '<%:Logs%>',
		state: '<%:State%>',
		enabled: '<%:Enabled%>',
		account: '<%:Account%>',
		network: '<%:Network%>',
		device: '<%:Device%>',
		ipaddr: '<%:IPv4 address%>',
		mac: '<%:MAC address%>',
		server: '<%:Authentication server%>',
		pid: '<%:PID%>',
		version: '<%:Installed version%>',
		unavailable: '<%:Unavailable%>',
		applying: '<%:Applying…%>',
		completed: '<%:Operation completed.%>',
		failed: '<%:Operation failed.%>',
		noInstances: '<%:No instances configured. Add one on the Settings page.%>'
	};

	function byId(id) {
		return document.getElementById(id);
	}

	function esc(value) {
		var node = document.createElement('span');
		node.textContent = value === undefined || value === null ? '' : String(value);
		return node.innerHTML;
	}

	function dash(value) {
		return (value === undefined || value === null || value === '') ? '-' : esc(value);
	}

	function request(method, url, body, done) {
		var xhr = new XMLHttpRequest();
		xhr.open(method, url, true);

		if (method === 'POST') {
			xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
		}

		xhr.onreadystatechange = function() {
			if (xhr.readyState !== 4) {
				return;
			}

			if (xhr.status >= 200 && xhr.status < 300) {
				var data = null;
				try {
					data = JSON.parse(xhr.responseText);
				} catch (e) {
					data = null;
				}
				done(null, data);
			} else {
				done(new Error('HTTP ' + xhr.status), null);
			}
		};

		xhr.send(body || null);
	}

	function row(label, value) {
		return '<div class="scut-row">' +
			'<div class="scut-label">' + label + '</div>' +
			'<div class="scut-value">' + value + '</div>' +
			'</div>';
	}

	function actionButton(action, instance, label) {
		return '<button class="cbi-button" type="button" onclick="scutServiceAction(\'' +
			action + '\', \'' + esc(instance) + '\'); return false;">' + label + '</button>';
	}

	function instanceCard(inst) {
		var state = inst.running
			? '<span class="scut-good">' + L.running + '</span>'
			: '<span class="scut-bad">' + L.stopped + '</span>';

		var h = '<div class="scut-status-card">';
		h += '<h3>' + dash(inst.name) +
			' <span class="scut-muted">(' + dash(inst.id) + ')</span></h3>';

		h += row(L.state, state);
		h += row(L.enabled, inst.enabled
			? '<span class="scut-good">' + L.yes + '</span>'
			: L.no);
		h += row(L.account, dash(inst.username));
		h += row(L.network, dash(inst.interface));
		h += row(L.device, dash(inst.device));
		h += row(L.ipaddr, dash(inst.ipaddr));
		h += row(L.mac, dash(inst.mac));
		h += row(L.server, dash(inst.server));
		h += row(L.pid, dash(inst.pid));

		h += '<div class="scut-actions">';
		if (!inst.running) {
			h += actionButton('start', inst.id, L.start);
		}
		h += actionButton('restart', inst.id, L.restart);
		h += actionButton('logoff', inst.id, L.logoff);
		if (inst.running) {
			h += actionButton('stop', inst.id, L.stop);
		}
		h += '<a class="cbi-button" href="' + logsUrl + '?instance=' +
			encodeURIComponent(inst.id) + '">' + L.logs + '</a>';
		h += '</div>';

		h += '</div>';
		return h;
	}

	function render(data) {
		var host = byId('scut-instances');
		var html = '';

		if (!data || !data.instances || !data.instances.length) {
			html = '<div class="scut-muted">' + L.noInstances + '</div>';
		} else {
			for (var i = 0; i < data.instances.length; i++) {
				html += instanceCard(data.instances[i]);
			}
		}

		host.innerHTML = html;

		var enabled = byId('scut-enabled');
		if (enabled) {
			enabled.innerHTML = data && data.enabled
				? '<span class="scut-good">' + L.yes + '</span>'
				: L.no;
		}

		var version = byId('scut-version');
		if (version) {
			version.textContent = data && data.version ? data.version : '';
		}
	}

	function refreshStatus() {
		request('GET', statusUrl, null, function(err, data) {
			if (err || !data) {
				byId('scut-instances').innerHTML =
					'<div class="scut-bad">' + L.unavailable + '</div>';
				return;
			}
			render(data);
		});
	}

	function refreshNetstat() {
		request('GET', netstatUrl, null, function(err, data) {
			var node = byId('scut-netstat');

			if (err || !data || !node) {
				if (node) {
					node.textContent = L.unavailable;
					node.className = 'scut-value scut-bad';
				}
				return;
			}

			if (data.stat === 'internet') {
				node.innerHTML = '<span class="scut-good"><%:Internet available%></span>';
			} else if (data.stat === 'no_login') {
				node.innerHTML = '<span class="scut-warn"><%:Campus authentication may be required%></span>';
			} else if (data.stat === 'no_internet') {
				node.innerHTML = '<span class="scut-bad"><%:No Internet connectivity%></span>';
			} else {
				node.innerHTML = '<span class="scut-muted"><%:Unknown%></span>';
			}
		});
	}

	window.scutServiceAction = function(action, instance) {
		var message = byId('scut-message');
		if (message) {
			message.textContent = L.applying;
		}

		request(
			'POST',
			serviceUrl,
			'token=' + encodeURIComponent(csrfToken) +
			'&action=' + encodeURIComponent(action) +
			'&instance=' + encodeURIComponent(instance || ''),
			function(err, data) {
				if (message) {
					if (err || !data || !data.success) {
						message.textContent = L.failed;
						message.className = 'scut-bad';
					} else {
						message.textContent = L.completed;
						message.className = 'scut-good';
					}
				}

				window.setTimeout(refreshStatus, 700);
			}
		);
	};

	refreshStatus();
	refreshNetstat();

	window.setInterval(refreshStatus, 5000);
	window.setInterval(refreshNetstat, 15000);
})();
</script>

<%+footer%>
